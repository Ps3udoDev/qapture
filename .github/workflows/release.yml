name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag de versión a publicar (ej. v0.4.0)'
        required: false
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish-release:
    name: Build & Publish Release
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run test quality gate
        run: |
          pnpm typecheck
          pnpm test
          cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build desktop app and create release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ inputs.tag_name || github.ref_name }}
          releaseName: 'Qapture ${{ inputs.tag_name || github.ref_name }}'
          releaseBody: 'Instalador oficial de Qapture ${{ inputs.tag_name || github.ref_name }}. Descarga el archivo `.exe` (NSIS setup) o `.msi` adjunto para instalar en Windows.'
          releaseDraft: false
          prerelease: false
