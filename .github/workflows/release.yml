name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag de versión a publicar (ej. v0.6.0)'
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish-release:
    name: Build & Publish Release
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag_name || github.ref }}

      - name: Resolver tag
        shell: bash
        run: |
          TAG="${{ inputs.tag_name || github.ref_name }}"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "VERSION=${TAG#v}" >> "$GITHUB_ENV"

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verificar versiones contra el tag
        shell: bash
        run: pnpm check-version "$TAG"

      - name: Run test quality gate
        shell: bash
        run: |
          pnpm lint
          pnpm typecheck
          pnpm test
          cargo test --manifest-path src-tauri/Cargo.toml

      - name: Notas del release
        id: notes
        shell: bash
        run: |
          node scripts/release-notes.mjs "$TAG" > release-notes.md
          { echo "notes<<QAPTURE_NOTES_EOF"; cat release-notes.md; echo "QAPTURE_NOTES_EOF"; } >> "$GITHUB_OUTPUT"

      - name: Build desktop app and create draft release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ env.TAG }}
          releaseName: 'Qapture ${{ env.TAG }}'
          releaseBody: |
            ${{ steps.notes.outputs.notes }}

            Windows puede mostrar un aviso de SmartScreen al instalar. Consulta cómo continuar en [docs/usuario/instalacion.md](https://github.com/Ps3udoDev/qapture/blob/main/docs/usuario/instalacion.md).
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true
          updaterJsonPreferNsis: true
          args: --config src-tauri/tauri.release.conf.json

      - name: Crear y subir ZIP portable
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          New-Item -ItemType Directory -Force portable | Out-Null
          Copy-Item src-tauri/target/release/qapture.exe portable/Qapture.exe
          New-Item -ItemType File -Force portable/portable.flag | Out-Null
          Copy-Item src-tauri/portable/LEEME.txt portable/LEEME.txt
          $zip = "Qapture_${env:VERSION}_portable.zip"
          Compress-Archive -Path portable/* -DestinationPath $zip -Force
          gh release upload "${env:TAG}" $zip --clobber
