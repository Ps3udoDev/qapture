name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag de versión a publicar (ej. v0.6.0)'
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Un solo job crea el borrador: si cada build de la matriz lo creara, podrían salir dos borradores.
  create-release:
    name: Crear borrador del release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      version: ${{ steps.tag.outputs.version }}
      release_id: ${{ steps.release.outputs.result }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag_name || github.ref }}

      - name: Resolver tag
        id: tag
        shell: bash
        env:
          RAW_TAG: ${{ inputs.tag_name || github.ref_name }}
        run: |
          TAG="$RAW_TAG"
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag inválido: '$TAG' (se esperaba vX.Y.Z)" >&2
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verificar versiones contra el tag
        run: node scripts/check-version.mjs "${{ steps.tag.outputs.tag }}"

      - name: Notas del release
        run: |
          node scripts/release-notes.mjs "${{ steps.tag.outputs.tag }}" > release-notes.md
          cat >> release-notes.md <<'EOF'

          Windows puede mostrar un aviso de SmartScreen al instalar. Consulta cómo continuar en [docs/usuario/instalacion.md](https://github.com/Ps3udoDev/qapture/blob/main/docs/usuario/instalacion.md).

          En Linux usa el `.AppImage` (se actualiza solo), el `.deb` (Debian/Ubuntu) o el `.rpm` (Fedora/openSUSE). Detalles en la misma guía.
          EOF

      - name: Crear (o reutilizar) el borrador
        id: release
        uses: actions/github-script@v7
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        with:
          script: |
            const fs = require('fs');
            const tag = process.env.TAG;
            const body = fs.readFileSync('release-notes.md', 'utf8');
            // Re-ejecutar el workflow no debe duplicar el borrador.
            const releases = await github.paginate(github.rest.repos.listReleases, context.repo);
            const existing = releases.find((r) => r.tag_name === tag);
            if (existing) {
              if (!existing.draft) core.setFailed(`El release ${tag} ya está publicado.`);
              return existing.id;
            }
            const { data } = await github.rest.repos.createRelease({
              ...context.repo,
              tag_name: tag,
              name: `Qapture ${tag}`,
              body,
              draft: true,
              prerelease: false,
            });
            return data.id;

  build:
    name: Build ${{ matrix.name }}
    needs: create-release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
          # 24.04: pipewire-rs (xcap) necesita libpipewire más nueva que la de 22.04.
          - name: Linux
            os: ubuntu-24.04
    runs-on: ${{ matrix.os }}
    env:
      TAG: ${{ needs.create-release.outputs.tag }}
      VERSION: ${{ needs.create-release.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag_name || github.ref }}

      - name: Dependencias del sistema (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev patchelf \
            libxcb1-dev libxcb-randr0-dev libxcb-shm0-dev libdbus-1-dev \
            libpipewire-0.3-dev libspa-0.2-dev libclang-dev libgbm-dev libegl1-mesa-dev libdrm-dev

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run test quality gate
        shell: bash
        run: |
          pnpm lint
          pnpm typecheck
          pnpm test
          cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build desktop app and upload to draft release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          includeUpdaterJson: true
          updaterJsonPreferNsis: true
          args: --config src-tauri/tauri.release.conf.json

      - name: Crear y subir ZIP portable
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          New-Item -ItemType Directory -Force portable | Out-Null
          Copy-Item src-tauri/target/release/qapture.exe portable/Qapture.exe
          New-Item -ItemType File -Force portable/portable.flag | Out-Null
          Copy-Item src-tauri/portable/LEEME.txt portable/LEEME.txt
          $zip = "Qapture_${env:VERSION}_portable.zip"
          Compress-Archive -Path portable/* -DestinationPath $zip -Force

          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = [IO.Compression.ZipFile]::OpenRead((Resolve-Path $zip).Path)
          try { $entries = @($archive.Entries | ForEach-Object { $_.FullName }) } finally { $archive.Dispose() }
          foreach ($required in 'Qapture.exe', 'portable.flag', 'LEEME.txt') {
            if ($entries -notcontains $required) {
              throw "Falta $required en la raíz del ZIP portable (contiene: $($entries -join ', '))"
            }
          }

          $releaseId = "${{ needs.create-release.outputs.release_id }}"
          gh api --method POST -H "Content-Type: application/zip" "https://uploads.github.com/repos/${{ github.repository }}/releases/$releaseId/assets?name=$zip" --input $zip
          if ($LASTEXITCODE -ne 0) { throw "Falló la subida del ZIP portable (gh api)." }
