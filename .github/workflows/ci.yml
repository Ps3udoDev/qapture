name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (Lint, Typecheck, Test & Build)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Versiones coherentes en los 4 archivos
        run: pnpm check-version

      - name: Lint (ESLint)
        run: pnpm lint

      - name: Check types (TypeScript)
        run: pnpm typecheck

      - name: Run frontend tests (Vitest)
        run: pnpm test

      - name: Build web bundle (Vite)
        run: pnpm build

  backend:
    name: Backend (Rust Fmt, Clippy & Test) · ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Dependencias del sistema (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev patchelf \
            libxcb1-dev libxcb-randr0-dev libxcb-shm0-dev libdbus-1-dev \
            libpipewire-0.3-dev libspa-0.2-dev libclang-dev libgbm-dev libegl1-mesa-dev libdrm-dev

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Check code formatting
        run: cargo fmt --check --manifest-path src-tauri/Cargo.toml

      - name: Run clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Run Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build MCP bridge
        run: cargo build --manifest-path src-tauri/Cargo.toml --bin qapture-mcp

      - name: Test build scripts
        run: node --test scripts/sidecar.test.mjs

      - name: El fixture de contrato no cambió
        run: git diff --exit-code -- src/infrastructure/tauri/__fixtures__/contracts.json

  tauri-build:
    name: Tauri build (sin instaladores) · ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Dependencias del sistema (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev patchelf \
            libxcb1-dev libxcb-randr0-dev libxcb-shm0-dev libdbus-1-dev \
            libpipewire-0.3-dev libspa-0.2-dev libclang-dev libgbm-dev libegl1-mesa-dev libdrm-dev

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: tauri-build-${{ matrix.os }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Tauri (debug, sin instaladores)
        run: pnpm tauri build --no-bundle --debug

  # La protección de main exige estos dos nombres; los jobs con matriz llevan el SO en el nombre.
  # `always()` + revisar `result`: un check requerido que queda "skipped" contaría como aprobado.
  backend-required:
    name: Backend (Rust Fmt, Clippy & Test)
    needs: backend
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Todas las plataformas pasaron
        run: test "${{ needs.backend.result }}" = "success"

  tauri-build-required:
    name: Tauri build (sin instaladores)
    needs: tauri-build
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Todas las plataformas pasaron
        run: test "${{ needs.tauri-build.result }}" = "success"
