[package]
name = "qapture"
version = "1.0.2"
description = "Qapture — evidencias y matrices de prueba QA (Teams4Soft)"
authors = ["Teams4Soft"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "qapture_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "protocol-asset"] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40", features = ["bundled", "backup"] }
base64 = "0.22.1"
# Paquetes .qapture (F5). zip 9: crates.io retiró (yank) toda la serie < 9.0.3.
zip = { version = "9.0.4", default-features = false, features = ["deflate"] }
uuid = { version = "1.28.0", features = ["v4"] }
thiserror = "2"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
xcap = "0.9.8"
# zip 9: crates.io retiró (yank) toda la serie zip < 9.0.3 y la 0.99.1 publicada todavía pide zip 8.
rust_xlsxwriter = { git = "https://github.com/jmcnamara/rust_xlsxwriter", rev = "ade0a017439d169b2a9c4848fe1cb66919c0ca3d" }
tauri-plugin-dialog = "2.8.3"
tauri-plugin-opener = "2.7.2"
tauri-plugin-clipboard-manager = "2.5.0"
tauri-plugin-notification = "2.7.0"
tauri-plugin-global-shortcut = "2.4.1"
tauri-plugin-autostart = "2.7.0"
tauri-plugin-updater = "2.14.0"
reqwest = { version = "0.13", default-features = false, features = ["json", "form", "rustls-no-provider"] }
tokio = { version = "1", features = ["time"] }
# Proveedor TLS ring (el mismo que usa tauri-plugin-updater); evita aws-lc-sys.
rustls = { version = "0.23", default-features = false, features = ["ring"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
calamine = "0.36.1"
mockito = "1"
tokio = { version = "1", features = ["macros", "rt"] }

# calamine 0.36 (solo tests) pide zip ^8.6 y crates.io retiró toda la serie 8.x: se toma del tag.
[patch.crates-io]
zip8 = { package = "zip", git = "https://github.com/zip-rs/zip2", tag = "v8.6.0" }
